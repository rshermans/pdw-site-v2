name: Sync from sitepdw3

on:
  schedule:
    - cron: '0 * * * *'  # Executa de hora a hora (ajusta como quiseres)
  workflow_dispatch:      # Permite executar manualmente no GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from source repo
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Adiciona o repositório de origem como remote
          git remote add source https://github.com/rmagalhaes-byte/sitepdw3.git

          # Busca as alterações do repositório de origem
          git fetch source

          # Faz merge da branch principal (ajusta 'main' ou 'master' conforme necessário)
          git checkout main  # ou 'master' se for o caso
          git merge source/main --allow-unrelated-histories -X theirs --no-edit

          # Envia as alterações para o repositório de destino
          git push origin main
