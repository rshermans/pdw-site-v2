name: Sync from sitepdw3 (main) to pdw-site-v2 (master)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          ref: master

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Remove source remote
        run: git remote remove source || true

      - name: Add source remote
        run: |
          git remote add source \
          https://github.com/rmagalhaes-byte/sitepdw3.git

      - name: Fetch source
        run: git fetch source main

      - name: Merge source/main into master
        run: |
          git checkout master
          git merge source/main \
            --allow-unrelated-histories \
            -X theirs \
            --no-edit

      - name: Push changes
        run: |
          git remote set-url origin \
          https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/rshermans/pdw-site-v2.git

          git push origin master
